
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akun KopiHub</title>
  <style>
    :root {
      --green: #174c38;
      --light: #e8f2ec;
      --bg: #f5f7f5;
      --text: #26352d;
      --muted: #718078;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 26px 22px;
      box-shadow: 0 8px 30px #173d2c12;
    }

    .brand {
      text-align: center;
      color: var(--green);
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 22px;
    }

    .tab {
      border: 0;
      border-radius: 9px;
      padding: 12px;
      background: var(--light);
      color: var(--green);
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: var(--green);
      color: white;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin: 14px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dce4de;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    input:focus {
      outline: 2px solid #9bc7ab;
      border-color: var(--green);
    }

    .main-button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .link-button {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 5px;
      background: transparent;
      border: 0;
      color: var(--green);
      text-decoration: underline;
      cursor: pointer;
    }

    .message {
      display: none;
      padding: 12px;
      margin-top: 16px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.show { display: block; }
    .message.error { background: #fff0ef; color: #a32d25; }
    .message.success { background: var(--light); color: var(--green); }

    .hidden { display: none; }

    .small {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="brand">☕ KopiHub</div>
    <div class="subtitle">Platform digital untuk kedai kopi</div>

    <div class="tabs">
      <button class="tab active" id="loginTab" type="button">
        Masuk
      </button>
      <button class="tab" id="signupTab" type="button">
        Daftar
      </button>
    </div>

    <form id="accountForm">
      <div id="nameField" class="hidden">
        <label for="fullName">Nama lengkap</label>
        <input id="fullName" type="text" autocomplete="name"
          placeholder="Nama kamu">
      </div>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email"
        placeholder="nama@email.com" required>

      <label for="password">Kata sandi</label>
      <input id="password" type="password"
        autocomplete="current-password" minlength="6"
        placeholder="Minimal 6 karakter" required>

      <button id="submitButton" class="main-button" type="submit">
        Masuk ke KopiHub
      </button>
    </form>

    <button id="forgotButton" class="link-button" type="button">
      Lupa kata sandi?
    </button>

    <div id="message" class="message" role="status"
      aria-live="polite"></div>

    <div class="small">
      Dengan menggunakan KopiHub, jaga kerahasiaan kata sandi akunmu.
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Ganti dengan konfigurasi proyek Supabase milikmu.
    const SUPABASE_URL = "https://ozcliasebeydgyvgluht.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_X3z6XFroL-eNdwB14y6dYw_81dvj1yN";

    const { createClient } = supabase;
    const client = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("accountForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const nameInput = document.getElementById("fullName");
    const nameField = document.getElementById("nameField");
    const submitButton = document.getElementById("submitButton");
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const forgotButton = document.getElementById("forgotButton");
    const messageBox = document.getElementById("message");

    let mode = "login";

    function showMessage(text, type = "success") {
      messageBox.textContent = text;
      messageBox.className = "message show " + type;
    }

    function setMode(nextMode) {
      mode = nextMode;
      const isSignup = mode === "signup";

      loginTab.classList.toggle("active", !isSignup);
      signupTab.classList.toggle("active", isSignup);
      nameField.classList.toggle("hidden", !isSignup);
      nameInput.required = isSignup;
      passwordInput.autocomplete =
        isSignup ? "new-password" : "current-password";
      submitButton.textContent =
        isSignup ? "Buat Akun" : "Masuk ke KopiHub";
      forgotButton.classList.toggle("hidden", isSignup);
      messageBox.className = "message";
    }

    loginTab.addEventListener("click", () => setMode("login"));
    signupTab.addEventListener("click", () => setMode("signup"));

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (SUPABASE_URL.includes("GANTI_DENGAN") ||
          SUPABASE_PUBLISHABLE_KEY.includes("GANTI_DENGAN")) {
        showMessage(
          "Konfigurasi Supabase belum diisi. Masukkan URL proyek dan publishable key.",
          "error"
        );
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Mohon tunggu...";

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        if (mode === "signup") {
          const { data, error } = await client.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name: nameInput.value.trim()
              },
              emailRedirectTo: window.location.origin +
                "/kopihub/akun.html"
            }
          });

          if (error) throw error;

          if (data.session) {
            showMessage(
              "Pendaftaran berhasil. Mengarahkan ke dashboard..."
            );
            window.location.href =
              "/kopihub/dashboard-owner.html";
            return;
          }

          showMessage(
            "Pendaftaran diterima. Periksa email untuk verifikasi akun sebelum masuk."
          );
        } else {
          const { error } = await client.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          showMessage("Login berhasil. Membuka dashboard...");
          window.location.href =
            "/kopihub/dashboard-owner.html";
          return;
        }
      } catch (error) {
        showMessage(error.message || "Terjadi kesalahan.", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent =
          mode === "signup" ? "Buat Akun" : "Masuk ke KopiHub";
      }
    });

    forgotButton.addEventListener("click", async () => {
      const email = emailInput.value.trim();

      if (!email) {
        showMessage(
          "Masukkan email terlebih dahulu, lalu tekan Lupa kata sandi.",
          "error"
        );
        emailInput.focus();
        return;
      }

      forgotButton.disabled = true;

      try {
        const { error } = await client.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin +
            "/kopihub/reset-password.html"
        });

        if (error) throw error;

        showMessage(
          "Jika email terdaftar, instruksi pemulihan kata sandi akan dikirim. Periksa kotak masuk dan folder spam."
        );
      } catch (error) {
        showMessage(error.message || "Gagal mengirim instruksi.", "error");
      } finally {
        forgotButton.disabled = false;
      }
    });

    async function checkExistingSession() {
      const { data, error } = await client.auth.getSession();

      if (!error && data.session) {
        window.location.replace(
          "/kopihub/dashboard-owner.html"
        );
      }
    }

    checkExistingSession();
  </script>
</body>
</html>
