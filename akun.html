
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b2a">
  <title>Akun KopiHub</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f3f6f3;
      color: #183b2b;
    }

    .container {
      max-width: 440px;
      margin: 25px auto;
      padding: 28px 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 28px #123b2a12;
    }

    .logo {
      text-align: center;
      color: #14532d;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subjudul {
      text-align: center;
      color: #647067;
      margin-bottom: 26px;
    }

    h2 {
      font-size: 20px;
      margin-top: 24px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5ce;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    input:focus {
      outline: 2px solid #7ba98b;
      border-color: #14532d;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 13px;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .utama {
      background: #14532d;
      color: white;
    }

    .sekunder {
      background: #e9f1eb;
      color: #14532d;
    }

    .tautan {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #14532d;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      padding: 8px;
      font-size: 14px;
    }

    #pesan {
      overflow-wrap: anywhere;
      line-height: 1.5;
      font-size: 14px;
      margin-top: 18px;
    }

    .catatan {
      color: #647067;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">☕ KopiHub</div>
    <p class="subjudul">
      Satu akun untuk memulai perjalanan kedai kamu.
    </p>

    <h2>Buat akun</h2>

    <form id="formDaftar">
      <label for="nama">Nama lengkap</label>
      <input id="nama" type="text"
        autocomplete="name" required
        placeholder="Nama kamu">

      <label for="email">Alamat email</label>
      <input id="email" type="email"
        autocomplete="email" required
        placeholder="nama@email.com">

      <label for="password">Kata sandi</label>
      <input id="password" type="password"
        autocomplete="new-password" minlength="6"
        required placeholder="Minimal 6 karakter">

      <button type="button" id="lihatSandi"
        class="sekunder">Tampilkan kata sandi</button>

      <button type="submit" id="tombolDaftar"
        class="utama">Daftar akun</button>
    </form>

    <h2>Sudah punya akun?</h2>

    <button type="button" id="tombolLogin"
      class="utama">Login</button>

    <button type="button" id="tombolLupa"
      class="sekunder">Lupa kata sandi?</button>

    <p id="pesan" role="status" aria-live="polite"></p>

    <p class="catatan">
      Dengan menggunakan KopiHub, pastikan email yang kamu masukkan
      benar dan dapat diakses untuk verifikasi atau pemulihan akun.
    </p>

    <a href="index.html" class="tautan">
      Kembali ke halaman utama
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Ganti dengan Project URL dan publishable key milikmu.
    // Gunakan publishable key, bukan service_role atau secret key.
    const SUPABASE_URL = "https://ozcliasebeydgyvgluht.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_X3z6XFroL-eNdwB14y6dYw_81dvj1yN";

    const pesan = document.getElementById("pesan");
    const formDaftar = document.getElementById("formDaftar");
    const nama = document.getElementById("nama");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const tombolDaftar = document.getElementById("tombolDaftar");
    const tombolLogin = document.getElementById("tombolLogin");
    const tombolLupa = document.getElementById("tombolLupa");
    const lihatSandi = document.getElementById("lihatSandi");

    function tampilkanPesan(teks) {
      pesan.textContent = teks;
    }

    let supabaseClient = null;

    try {
      if (
        SUPABASE_URL.startsWith("https://") &&
        !SUPABASE_URL.includes("GANTI_") &&
        SUPABASE_PUBLISHABLE_KEY &&
        !SUPABASE_PUBLISHABLE_KEY.includes("GANTI_")
      ) {
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );
      }
    } catch (error) {
      tampilkanPesan("Konfigurasi Supabase tidak valid.");
    }

    function periksaKonfigurasi() {
      if (!supabaseClient) {
        tampilkanPesan(
          "Isi Project URL dan publishable key Supabase terlebih dahulu."
        );
        return false;
      }
      return true;
    }

    lihatSandi.addEventListener("click", function () {
      const tampil = password.type === "text";
      password.type = tampil ? "password" : "text";
      lihatSandi.textContent = tampil
        ? "Tampilkan kata sandi"
        : "Sembunyikan kata sandi";
    });

    formDaftar.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!periksaKonfigurasi()) return;

      if (password.value.length < 6) {
        tampilkanPesan("Kata sandi minimal 6 karakter.");
        return;
      }

      tombolDaftar.disabled = true;
      tampilkanPesan("Sedang membuat akun...");

      try {
        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email.value.trim(),
            password: password.value,
            options: {
              data: {
                full_name: nama.value.trim()
              },
              emailRedirectTo:
                "https://sainusoffcl-tech.github.io/kopihub/"
            }
          });

        if (error) throw error;

        if (data.session) {
          tampilkanPesan(
            "Pendaftaran berhasil. Kamu sudah login ke KopiHub."
          );
        } else {
          tampilkanPesan(
            "Pendaftaran diterima. Periksa email untuk verifikasi, lalu login."
          );
        }
      } catch (error) {
        tampilkanPesan(
          "Pendaftaran gagal: " + error.message
        );
      } finally {
        tombolDaftar.disabled = false;
      }
    });

    tombolLogin.addEventListener("click", async function () {
      if (!periksaKonfigurasi()) return;

      const emailMasuk = email.value.trim();
      const passwordMasuk = password.value;

      if (!emailMasuk || !passwordMasuk) {
        tampilkanPesan(
          "Isi email dan kata sandi pada kolom di atas."
        );
        return;
      }

      tombolLogin.disabled = true;
      tampilkanPesan("Sedang masuk...");

      try {
        const { error } =
          await supabaseClient.auth.signInWithPassword({
            email: emailMasuk,
            password: passwordMasuk
          });

        if (error) throw error;

        tampilkanPesan(
          "Login berhasil! Selamat datang di KopiHub."
        );
      } catch (error) {
        tampilkanPesan("Login gagal: " + error.message);
      } finally {
        tombolLogin.disabled = false;
      }
    });

    tombolLupa.addEventListener("click", async function () {
      if (!periksaKonfigurasi()) return;

      const emailPemulihan = email.value.trim();

      if (!emailPemulihan) {
        tampilkanPesan(
          "Masukkan email akun pada kolom Alamat email terlebih dahulu."
        );
        email.focus();
        return;
      }

      tombolLupa.disabled = true;
      tampilkanPesan("Sedang memproses permintaan pemulihan...");

      try {
        const { error } =
          await supabaseClient.auth.resetPasswordForEmail(
            emailPemulihan,
            {
              redirectTo:
                "https://sainusoffcl-tech.github.io/kopihub/reset-password.html"
            }
          );

        if (error) throw error;

        tampilkanPesan(
          "Permintaan diproses. Periksa email dan folder Spam untuk tautan pemulihan."
        );
      } catch (error) {
        tampilkanPesan(
          "Permintaan pemulihan gagal: " + error.message
        );
      } finally {
        tombolLupa.disabled = false;
      }
    });
  </script>
</body>
</html>
