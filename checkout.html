
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153f32">
  <title>Checkout - Ontal Kopi</title>

  <style>
    :root {
      --green: #153f32;
      --green-light: #e8f2ec;
      --cream: #faf8f2;
      --text: #26342d;
      --muted: #718078;
      --border: #e2e8e3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    header {
      background: var(--green);
      color: white;
      padding: 22px 18px;
    }

    .header-inner, main {
      width: min(100% - 28px, 600px);
      margin: auto;
    }

    header a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    header h1 {
      margin: 12px 0 2px;
      font-size: 25px;
    }

    header p {
      margin: 0;
      color: #d7e7dc;
      font-size: 14px;
    }

    main { padding: 22px 0 40px; }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 19px;
      margin-bottom: 16px;
      box-shadow: 0 5px 18px #153f3208;
    }

    h2 {
      font-size: 18px;
      margin: 0 0 15px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin: 14px 0 7px;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5ded7;
      border-radius: 10px;
      font: inherit;
      font-size: 16px;
      background: white;
      color: var(--text);
    }

    textarea {
      min-height: 85px;
      resize: vertical;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .item:last-child { border-bottom: 0; }

    .item-name { font-weight: 600; }

    .item-detail {
      font-size: 13px;
      color: var(--muted);
    }

    .item-price {
      font-weight: 700;
      white-space: nowrap;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
      font-weight: 700;
      font-size: 18px;
    }

    .payment-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      margin: 10px 0;
      font-size: 14px;
    }

    .payment-option input {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: var(--green);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: var(--green);
      text-decoration: none;
      font-weight: 600;
    }

    .empty {
      text-align: center;
      padding: 12px 0;
      color: var(--muted);
    }

    .success-card {
      border: 1px solid #b8d9c4;
      background: #f0f8f2;
    }

    .success-card h2 { color: var(--green); }

    .order-number {
      background: white;
      border: 1px dashed #8ab59a;
      border-radius: 10px;
      padding: 13px;
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .5px;
      overflow-wrap: anywhere;
    }

    .success-detail {
      overflow-wrap: anywhere;
      font-size: 14px;
      margin: 9px 0;
    }

    .notice {
      background: #fff8e6;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      color: #76571a;
      margin-top: 16px;
    }

    .hidden { display: none !important; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 0 20px 25px;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <a href="menu.html">← Kembali ke menu</a>
      <h1>Ontal Kopi</h1>
      <p>Checkout pesanan kamu ☕</p>
    </div>
  </header>

  <main>
    <section id="checkout-content">
      <form id="checkout-form">
        <div class="card">
          <h2>🛍️ Ringkasan Pesanan</h2>
          <div id="order-items">
            <p class="empty">Memuat pesanan...</p>
          </div>
          <div class="total-row">
            <span>Total</span>
            <span id="order-total">Rp0</span>
          </div>
        </div>

        <div class="card">
          <h2>👤 Informasi Pelanggan</h2>

          <label for="customer-name">Nama lengkap *</label>
          <input
            id="customer-name"
            name="customerName"
            type="text"
            autocomplete="name"
            maxlength="100"
            placeholder="Masukkan nama kamu"
            required
          >

          <label for="customer-phone">Nomor WhatsApp *</label>
          <input
            id="customer-phone"
            name="customerPhone"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            maxlength="20"
            placeholder="Contoh: 081234567890"
            required
          >
          <p class="hint">Pastikan nomor WhatsApp benar.</p>

          <label for="customer-note">Catatan pesanan (opsional)</label>
          <textarea
            id="customer-note"
            name="customerNote"
            maxlength="500"
            placeholder="Contoh: gula sedikit, tanpa es..."
          ></textarea>
        </div>

        <div class="card">
          <h2>💳 Metode Pembayaran</h2>

          <label class="payment-option">
            <input
              type="radio"
              name="payment"
              value="Bayar di kasir"
              checked
            >
            <span>Bayar di kasir</span>
          </label>

          <p class="hint">
            Pembayaran online belum tersedia pada versi demo ini.
          </p>
        </div>

        <button id="confirm-button" type="submit">
          Konfirmasi Pesanan
        </button>

        <a class="back-link" href="menu.html">
          + Tambah menu lainnya
        </a>
      </form>
    </section>

    <section id="success" class="card success-card hidden"
      aria-live="polite">
    </section>
  </main>

  <footer>
    Ontal Kopi · Pemesanan versi demo
  </footer>

  <script>
    (() => {
      "use strict";

      const form = document.getElementById("checkout-form");
      const itemsContainer = document.getElementById("order-items");
      const totalElement = document.getElementById("order-total");
      const confirmButton = document.getElementById("confirm-button");
      const checkoutContent =
        document.getElementById("checkout-content");
      const success = document.getElementById("success");

      const rupiah = value =>
        "Rp" + value.toLocaleString("id-ID");

      const escapeHTML = value =>
        String(value).replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);

      let orderItems = [];
      let total = 0;
      let orderValid = false;

      function loadOrder() {
        try {
          const raw = sessionStorage.getItem("kopihubCheckout");

          if (!raw) {
            showEmpty("Pesanan tidak ditemukan. Silakan pilih menu lagi.");
            return;
          }

          const parsed = JSON.parse(raw);

          if (!Array.isArray(parsed) || parsed.length === 0) {
            showEmpty("Keranjang kosong. Silakan pilih menu lagi.");
            return;
          }

          const cleaned = parsed.map(item => {
            const name = String(item.name || "").trim();
            const price = Number(item.price);
            const qty = Number(item.qty);

            if (
              !name ||
              !Number.isSafeInteger(price) ||
              price <= 0 ||
              !Number.isSafeInteger(qty) ||
              qty <= 0 ||
              qty > 99 ||
              price > Number.MAX_SAFE_INTEGER / qty
            ) {
              throw new Error("Data menu tidak valid.");
            }

            return {
              name,
              price,
              qty,
              subtotal: price * qty
            };
          });

          orderItems = cleaned;
          total = cleaned.reduce(
            (sum, item) => sum + item.subtotal, 0
          );

          if (!Number.isSafeInteger(total) || total <= 0) {
            throw new Error("Total pesanan tidak valid.");
          }

          itemsContainer.innerHTML = cleaned.map(item => `
            <div class="item">
              <div>
                <div class="item-name">
                  ${escapeHTML(item.name)}
                </div>
                <div class="item-detail">
                  ${item.qty} × ${rupiah(item.price)}
                </div>
              </div>
              <div class="item-price">
                ${rupiah(item.subtotal)}
              </div>
            </div>
          `).join("");

          totalElement.textContent = rupiah(total);
          orderValid = true;
          confirmButton.disabled = false;
        } catch (error) {
          console.error("Gagal memuat pesanan:", error);
          showEmpty(
            "Data pesanan bermasalah. Kembali ke menu dan pilih ulang."
          );
        }
      }

      function showEmpty(message) {
        orderValid = false;
        itemsContainer.innerHTML =
          `<p class="empty">${escapeHTML(message)}</p>`;
        totalElement.textContent = "Rp0";
        confirmButton.disabled = true;
      }

      form.addEventListener("submit", event => {
        event.preventDefault();

        if (!orderValid || orderItems.length === 0) {
          alert("Pesanan tidak tersedia. Silakan pilih menu lagi.");
          return;
        }

        if (!form.reportValidity()) return;

        const name = document
          .getElementById("customer-name").value.trim();

        const phone = document
          .getElementById("customer-phone").value.trim();

        const note = document
          .getElementById("customer-note").value.trim();

        const paymentInput = document.querySelector(
          'input[name="payment"]:checked'
        );

        if (!name || !phone || !paymentInput) {
          alert("Lengkapi nama, WhatsApp, dan metode pembayaran.");
          return;
        }

        const payment = paymentInput.value;
        const orderNumber =
          "DEMO-" + Date.now().toString().slice(-8);

        const itemRows = orderItems.map(item => `
          <div class="item">
            <div>
              <div class="item-name">
                ${escapeHTML(item.name)}
              </div>
              <div class="item-detail">
                ${item.qty} × ${rupiah(item.price)}
              </div>
            </div>
            <div class="item-price">
              ${rupiah(item.subtotal)}
            </div>
          </div>
        `).join("");

        success.innerHTML = `
          <h2>🎉 Pesanan demo berhasil dibuat!</h2>
          <p class="success-detail">Nomor pesanan kamu:</p>
          <div class="order-number">
            ${escapeHTML(orderNumber)}
          </div>

          <h3>Informasi Pelanggan</h3>
          <p class="success-detail">
            <strong>Nama:</strong> ${escapeHTML(name)}
          </p>
          <p class="success-detail">
            <strong>WhatsApp:</strong> ${escapeHTML(phone)}
          </p>

          <h3>Ringkasan Pesanan</h3>
          ${itemRows}

          <div class="total-row">
            <span>Total pembayaran</span>
            <span>${rupiah(total)}</span>
          </div>

          <p class="success-detail">
            <strong>Metode pembayaran:</strong>
            ${escapeHTML(payment)}
          </p>

          ${note ? `
            <p class="success-detail">
              <strong>Catatan:</strong> ${escapeHTML(note)}
            </p>
          ` : ""}

          <div class="notice">
            <strong>Perhatian:</strong> Ini adalah konfirmasi demo.
            Pesanan belum tersimpan permanen dan belum dikirim ke
            pihak Ontal Kopi. Nomor demo ini bukan bukti pembayaran.
          </div>

          <p style="margin-top:18px">
            Terima kasih sudah mencoba pemesanan Ontal Kopi!
          </p>

          <button id="back-to-menu" type="button"
            style="margin-top:12px">
            Kembali ke Menu
          </button>
        `;

        checkoutContent.classList.add("hidden");
        success.classList.remove("hidden");

        document.getElementById("back-to-menu")
          .addEventListener("click", () => {
            window.location.href = "menu.html";
          });

        success.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      });

      loadOrder();
    })();
  </script>
</body>
</html>
