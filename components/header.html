
<div class="kh-global-header" data-kh-header-root>
  <header class="kh-header-bar">

    <div class="kh-header-identity">
      <img
        class="kh-header-logo"
        data-kh-logo
        src=""
        alt="Logo resmi KopiHub"
        hidden
      >

      <div
        class="kh-header-logo-fallback"
        data-kh-logo-fallback
        aria-hidden="true"
      >
        KH
      </div>

      <div class="kh-header-brand">
        <div class="kh-header-wordmark">
          <span class="kh-header-kopi">Kopi</span><span class="kh-header-hub">Hub</span>
        </div>

        <div class="kh-header-tagline">
          SATU PLATFORM, BANYAK CERITA
        </div>

        <div
          class="kh-header-shop-name"
          data-kh-shop-name
          hidden
        ></div>

        <div
          class="kh-header-role"
          data-kh-role-label
        ></div>
      </div>
    </div>

    <div class="kh-header-actions">

      <!-- Khusus Owner: Profil Kedai -->
      <button
        class="kh-header-profile-button"
        type="button"
        data-kh-profile-open
        aria-label="Buka Identitas Kedai"
        title="Identitas Kedai"
        hidden
      >
        <img
          class="kh-header-profile-image"
          data-kh-shop-logo
          src=""
          alt=""
          hidden
        >

        <span
          class="kh-header-profile-fallback"
          data-kh-shop-logo-fallback
          aria-hidden="true"
        >
          <i data-lucide="user-round"></i>
        </span>
      </button>

      <!-- Navigasi utama -->
      <button
        class="kh-header-menu-button"
        type="button"
        data-kh-menu-open
        aria-label="Buka navigasi"
        aria-expanded="false"
        aria-controls="kh-header-menu"
      >
        <i data-lucide="menu"></i>
      </button>

    </div>
  </header>

  <div
    class="kh-header-overlay"
    data-kh-overlay
    hidden
  ></div>

  <nav
    class="kh-header-menu"
    id="kh-header-menu"
    data-kh-menu
    aria-label="Navigasi utama"
    aria-hidden="true"
    inert
  >
    <div class="kh-header-menu-handle"></div>

    <div class="kh-header-menu-heading">
      <div>
        <span class="kh-header-menu-eyebrow">KOPIHUB</span>
        <h2 data-kh-menu-title>Menu Navigasi</h2>
      </div>

      <button
        class="kh-header-close-button"
        type="button"
        data-kh-menu-close
        aria-label="Tutup navigasi"
      >
        <i data-lucide="x"></i>
      </button>
    </div>

    <div
      class="kh-header-menu-list"
      data-kh-menu-list
    ></div>

    <div class="kh-header-menu-footer">
      SATU PLATFORM, BANYAK CERITA
    </div>
  </nav>
</div>
