
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b2c">
  <title>Kasir - KopiHub</title>

  <style>
    :root {
      --green: #123b2c;
      --green-light: #1c5940;
      --cream: #faf9f5;
      --orange: #e99a55;
      --text: #24342c;
      --muted: #718078;
      --border: #e5e8e1;
      --white: #fff;
      --red: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
    }

    button, input, select { font: inherit; }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      font-weight: 700;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .topbar {
      background: var(--green);
      color: white;
      padding: 17px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand { font-size: 22px; font-weight: 800; }
    .brand span { color: var(--orange); }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-light { background: white; color: var(--green); }
    .btn-orange { background: var(--orange); color: #302014; }
    .btn-green { background: var(--green-light); color: white; }
    .btn-muted { background: #edf0e9; color: var(--text); }
    .btn-red { background: #fce8e6; color: var(--red); }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    .heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }

    h1 { font-size: 27px; margin: 0 0 7px; }
    h2 { font-size: 18px; margin: 0 0 14px; }
    p { line-height: 1.5; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }

    .notice {
      background: #eef5ef;
      border: 1px solid #d7e6d8;
      padding: 13px 15px;
      border-radius: 12px;
      margin-bottom: 18px;
      overflow-wrap: anywhere;
    }

    .notice.error {
      color: var(--red);
      background: #fff0ee;
      border-color: #f5d0cb;
    }

    .notice.warning {
      color: #765016;
      background: #fff7e8;
      border-color: #f2dfb6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat, .panel, .order-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(18, 59, 44, .04);
    }

    .stat { padding: 17px; }
    .stat-label { color: var(--muted); font-size: 13px; }
    .stat-number { font-size: 25px; font-weight: 800; margin-top: 8px; }

    .panel { padding: 17px; margin-bottom: 18px; }

    .filters {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(150px, 220px);
      gap: 10px;
    }

    input, select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      color: var(--text);
    }

    .orders {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .order-card { padding: 17px; min-width: 0; }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .order-number {
      font-weight: 800;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .badge {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: #edf0e9;
      white-space: normal;
    }

    .badge.pending { background: #fff1d8; color: #805315; }
    .badge.processing { background: #e5efff; color: #234f91; }
    .badge.ready_for_delivery { background: #dff5e6; color: #176536; }
    .badge.completed { background: #e9e9e9; color: #444; }
    .badge.paid { background: #dff5e6; color: #176536; }
    .badge.unpaid { background: #fff1d8; color: #805315; }

    .order-info {
      margin: 15px 0;
      display: grid;
      gap: 7px;
      font-size: 14px;
    }

    .items {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
      margin: 12px 0;
    }

    .item-row, .total-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0;
      font-size: 14px;
    }

    .item-row span:first-child { overflow-wrap: anywhere; }
    .total-row { font-weight: 800; font-size: 17px; }

    .order-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .order-actions button { flex: 1; }

    .empty {
      grid-column: 1 / -1;
      background: white;
      border: 1px dashed #ccd4ca;
      border-radius: 16px;
      text-align: center;
      padding: 35px 18px;
      color: var(--muted);
    }

    .hidden { display: none !important; }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 18px;
      font-size: 12px;
    }

    @media (max-width: 720px) {
      main { padding: 20px 12px 35px; }
      h1 { font-size: 24px; }
      .stats { gap: 8px; }
      .stat { padding: 12px 10px; }
      .stat-number { font-size: 20px; }
      .orders { grid-template-columns: 1fr; }
      .filters { grid-template-columns: 1fr; }
      .topbar { padding: 15px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">Kopi<span>Hub</span></div>
    <div class="top-actions">
      <button id="refreshBtn" class="btn-light">Muat Ulang</button>
      <button id="logoutBtn" class="btn-orange">Keluar</button>
    </div>
  </header>

  <main>
    <section class="heading">
      <div>
        <h1>Dashboard Kasir</h1>
        <div id="shopName" class="muted">Memeriksa kedai...</div>
      </div>
      <div id="lastUpdated" class="muted small"></div>
    </section>

    <div id="notice" class="notice">Menghubungkan ke Supabase...</div>

    <section id="dashboard" class="hidden">
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Pesanan Aktif</div>
          <div id="activeCount" class="stat-number">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Menunggu Pembayaran</div>
          <div id="unpaidCount" class="stat-number">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Pesanan Selesai</div>
          <div id="completedCount" class="stat-number">0</div>
        </div>
      </div>

      <section class="panel">
        <h2>Daftar Pesanan</h2>
        <div class="filters">
          <input id="searchInput" type="search"
            placeholder="Cari nomor pesanan atau nama pelanggan">
          <select id="statusFilter">
            <option value="all">Semua status</option>
            <option value="pending">Pesanan Masuk</option>
            <option value="processing">Sedang Diproses</option>
            <option value="ready_for_delivery">Siap Diantar</option>
            <option value="completed">Selesai</option>
          </select>
        </div>
      </section>

      <section id="orders" class="orders">
        <div class="empty">Memuat pesanan...</div>
      </section>
    </section>

    <div id="loginPrompt" class="panel hidden">
      <h2>Login diperlukan</h2>
      <p>Silakan login terlebih dahulu untuk membuka dashboard kasir.</p>
      <button id="loginBtn" class="btn-green">Buka Halaman Login</button>
    </div>
  </main>

  <footer>KopiHub · Platform pemesanan coffee shop</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    "use strict";

    const SUPABASE_URL = "https://ozcliasebeydgyvgluht.supabase.co";
    const SUPABASE_KEY = "sb_publishable_X3z6XFroL-eNdwB14y6dYw_81dvj1yN";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const $ = (id) => document.getElementById(id);

    let currentUser = null;
    let activeShop = null;
    let orders = [];
    let loading = false;

    const STATUS_LABELS = {
      pending: "Pesanan Masuk",
      processing: "Sedang Diproses",
      ready_for_delivery: "Siap Diantar",
      completed: "Selesai"
    };

    const NEXT_STATUS = {
      pending: "processing",
      processing: "ready_for_delivery",
      ready_for_delivery: "completed"
    };

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    function rupiah(value) {
      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(Number(value) || 0);
    }

    function showNotice(message, type) {
      const box = $("notice");
      box.textContent = message;
      box.className = "notice" + (type ? " " + type : "");
      box.classList.remove("hidden");
    }

    function statusLabel(status) {
      return STATUS_LABELS[status] || status || "Belum ditentukan";
    }

    function paymentLabel(status) {
      const value = String(status || "").toLowerCase();

      if (value === "paid" || value === "success") {
        return "Sudah Dibayar";
      }

      if (value === "awaiting_cashier" || value === "awaiting") {
        return "Menunggu Kasir";
      }

      if (value === "pending") return "Belum Dibayar";
      if (value === "failed") return "Gagal";
      if (value === "refunded") return "Dikembalikan";

      return status || "Belum diketahui";
    }

    function paymentIsPending(order) {
      const status = String(order.payment_status || "").toLowerCase();
      const method = String(order.payment_method || "").toLowerCase();

      return method === "cashier" &&
        ["awaiting_cashier", "awaiting", "pending"].includes(status);
    }

    function orderTotal(order) {
      if (order.total_amount != null) {
        return Number(order.total_amount) || 0;
      }

      if (order.total != null) {
        return Number(order.total) || 0;
      }

      return Number(order.subtotal) || 0;
    }

    function orderItems(order) {
      let value = order.items;

      if (typeof value === "string") {
        try {
          value = JSON.parse(value);
        } catch (_) {
          value = [];
        }
      }

      return Array.isArray(value) ? value : [];
    }

    function normalizeOrder(order) {
      const status = order.order_status || order.status || "pending";

      return {
        ...order,
        order_status: status,
        items: orderItems(order)
      };
    }

    function getOrderNumber(order) {
      return order.order_code || order.order_number || order.id;
    }

    function getTable(order) {
      return order.table_label || order.table_number || order.order_type || "Takeaway";
    }

    function formatDate(value) {
      if (!value) return "-";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) return "-";

      return date.toLocaleString("id-ID", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    async function loadShop(user) {
      const { data, error } = await db
        .from("kh_shop_members")
        .select("shop_id, role, kh_shops(id, name, slug)")
        .eq("user_id", user.id);

      if (error) throw error;

      const memberships = (data || []).filter(function (member) {
        const role = String(member.role || "").toLowerCase();
        return ["owner", "manager", "cashier", "kasir"].includes(role)
          && member.kh_shops;
      });

      if (!memberships.length) {
        throw new Error(
          "Akun ini belum memiliki kedai atau peran kasir. Periksa keanggotaan kh_shop_members."
        );
      }

      activeShop = memberships[0].kh_shops;

      $("shopName").textContent = activeShop.name || "Kedai KopiHub";
      $("dashboard").classList.remove("hidden");
    }

    async function loadOrders() {
      if (!activeShop || loading) return;

      loading = true;
      $("refreshBtn").disabled = true;

      try {
        const { data, error } = await db
          .from("kh_orders")
          .select(
            "id, shop_id, order_code, order_number, customer_name, customer_phone, order_type, table_label, table_number, status, subtotal, total_amount, created_at, items, payment_method, payment_status, order_status, order_note, notes, tax, total"
          )
          .eq("shop_id", activeShop.id)
          .order("created_at", { ascending: false });

        if (error) throw error;

        orders = (data || []).map(normalizeOrder);

        renderOrders();

        $("lastUpdated").textContent =
          "Diperbarui " + new Date().toLocaleTimeString("id-ID", {
            hour: "2-digit",
            minute: "2-digit"
          });

        showNotice("Terhubung ke Supabase. " +
          orders.length + " pesanan ditemukan.", "");
      } catch (error) {
        console.error("Gagal memuat pesanan:", error);
        showNotice(
          "Pesanan gagal dimuat: " + (error.message || "Kesalahan tidak diketahui") +
          ". Periksa izin tabel kh_orders dan kebijakan RLS Supabase.",
          "error"
        );

        $("orders").innerHTML =
          '<div class="empty">Pesanan tidak dapat dimuat. Tekan Muat Ulang setelah memeriksa izin database.</div>';
      } finally {
        loading = false;
        $("refreshBtn").disabled = false;
      }
    }

    function renderOrders() {
      const activeCount = orders.filter(function (order) {
        return order.order_status !== "completed";
      }).length;

      const unpaidCount = orders.filter(paymentIsPending).length;

      const completedCount = orders.filter(function (order) {
        return order.order_status === "completed";
      }).length;

      $("activeCount").textContent = activeCount;
      $("unpaidCount").textContent = unpaidCount;
      $("completedCount").textContent = completedCount;

      const query = $("searchInput").value.trim().toLowerCase();
      const selectedStatus = $("statusFilter").value;

      const visibleOrders = orders.filter(function (order) {
        const number = String(getOrderNumber(order)).toLowerCase();
        const customer = String(order.customer_name || "").toLowerCase();

        const matchesSearch = !query ||
          number.includes(query) ||
          customer.includes(query);

        const matchesStatus = selectedStatus === "all" ||
          order.order_status === selectedStatus;

        return matchesSearch && matchesStatus;
      });

      if (!visibleOrders.length) {
        $("orders").innerHTML =
          '<div class="empty"><strong>Belum ada pesanan</strong><p>Pesanan yang cocok dengan pencarian akan muncul di sini.</p></div>';
        return;
      }

      $("orders").innerHTML = visibleOrders.map(function (order) {
        const status = order.order_status;
        const items = order.items;
        const nextStatus = NEXT_STATUS[status];

        const itemHTML = items.length
          ? items.map(function (item) {
              const name = escapeHTML(item.name || item.product_name || "Menu");
              const qty = Number(item.qty || item.quantity || 1);
              const price = Number(item.price || item.unit_price || 0);

              return '<div class="item-row"><span>' + name +
                ' × ' + qty + '</span><strong>' +
                rupiah(price * qty) + '</strong></div>';
            }).join("")
          : '<div class="muted small">Detail item tidak tersedia.</div>';

        const note = order.order_note || order.notes || "";
        const method = String(order.payment_method || "").toLowerCase();
        const paymentStatus = String(order.payment_status || "").toLowerCase();

        let paymentHTML =
          '<span class="badge ' +
          (paymentStatus === "paid" ? "paid" : "unpaid") + '">' +
          escapeHTML(paymentLabel(order.payment_status)) +
          '</span>';

        let paymentButton = "";

        if (paymentIsPending(order)) {
          paymentButton =
            '<button class="btn-orange" data-payment="' +
            escapeHTML(order.id) + '">Konfirmasi Tunai</button>';
        }

        const statusButton = nextStatus
          ? '<button class="btn-green" data-status="' +
            escapeHTML(order.id) + '">' +
            escapeHTML(status === "pending" ? "Mulai Proses" :
              status === "processing" ? "Tandai Siap" : "Selesaikan") +
            '</button>'
          : "";

        return '<article class="order-card">' +
          '<div class="order-top"><div>' +
          '<div class="order-number">#' +
          escapeHTML(getOrderNumber(order)) + '</div>' +
          '<div class="muted small">' +
          escapeHTML(formatDate(order.created_at)) + '</div></div>' +
          '<span class="badge ' + escapeHTML(status) + '">' +
          escapeHTML(statusLabel(status)) + '</span></div>' +

          '<div class="order-info">' +
          '<div><strong>Pelanggan:</strong> ' +
          escapeHTML(order.customer_name || "Pelanggan") + '</div>' +
          (order.customer_phone
            ? '<div><strong>Telepon:</strong> ' +
              escapeHTML(order.customer_phone) + '</div>' : '') +
          '<div><strong>Meja / Tipe:</strong> ' +
          escapeHTML(getTable(order)) + '</div>' +
          '<div><strong>Pembayaran:</strong> ' +
          escapeHTML(method || "Belum ditentukan") + '</div>' +
          '<div><strong>Status bayar:</strong> ' + paymentHTML + '</div>' +
          '</div>' +

          '<div class="items">' + itemHTML + '</div>' +
          (note ? '<p class="small"><strong>Catatan:</strong> ' +
            escapeHTML(note) + '</p>' : '') +
          '<div class="total-row"><span>Total</span><span>' +
          rupiah(orderTotal(order)) + '</span></div>' +
          '<div class="order-actions">' +
          statusButton + paymentButton + '</div>' +
          '</article>';
      }).join("");
    }

    async function updateOrderStatus(orderId) {
      const order = orders.find(function (item) {
        return String(item.id) === String(orderId);
      });

      if (!order || !activeShop) return;

      const nextStatus = NEXT_STATUS[order.order_status];

      if (!nextStatus) {
        showNotice("Pesanan sudah mencapai status akhir.", "warning");
        return;
      }

      const button = document.querySelector(
        '[data-status="' + CSS.escape(String(orderId)) + '"]'
      );

      if (button) button.disabled = true;

      try {
        const { data, error } = await db
          .from("kh_orders")
          .update({ order_status: nextStatus })
          .eq("id", order.id)
          .eq("shop_id", activeShop.id)
          .select("id, order_status")
          .maybeSingle();

        if (error) throw error;

        if (!data) {
          throw new Error(
            "Status tidak berubah. Pastikan kebijakan UPDATE RLS mengizinkan akun ini."
          );
        }

        showNotice("Status pesanan berhasil diubah menjadi " +
          statusLabel(nextStatus) + ".", "");

        await loadOrders();
      } catch (error) {
        console.error("Gagal mengubah status:", error);
        showNotice(
          "Gagal mengubah status pesanan: " +
          (error.message || "Kesalahan database"),
          "error"
        );

        if (button) button.disabled = false;
      }
    }

    async function confirmCashPayment(orderId) {
      const order = orders.find(function (item) {
        return String(item.id) === String(orderId);
      });

      if (!order || !activeShop || !paymentIsPending(order)) return;

      const confirmed = window.confirm(
        "Pastikan uang tunai sebesar " + rupiah(orderTotal(order)) +
        " sudah benar-benar diterima. Konfirmasi pembayaran?"
      );

      if (!confirmed) return;

      const button = document.querySelector(
        '[data-payment="' + CSS.escape(String(orderId)) + '"]'
      );

      if (button) button.disabled = true;

      try {
        const { data, error } = await db
          .from("kh_orders")
          .update({ payment_status: "paid" })
          .eq("id", order.id)
          .eq("shop_id", activeShop.id)
          .select("id, payment_status")
          .maybeSingle();

        if (error) throw error;

        if (!data) {
          throw new Error(
            "Pembayaran belum berubah. Kebijakan RLS atau izin UPDATE payment_status mungkin belum tersedia."
          );
        }

        showNotice("Pembayaran tunai berhasil dikonfirmasi.", "");
        await loadOrders();
      } catch (error) {
        console.error("Gagal mengonfirmasi pembayaran:", error);
        showNotice(
          "Pembayaran belum dikonfirmasi: " +
          (error.message || "Kesalahan database") +
          ". Periksa izin payment_status di Supabase. Jangan menganggap pembayaran berhasil sebelum status berubah.",
          "error"
        );

        if (button) button.disabled = false;
      }
    }

    async function start() {
      try {
        if (!window.supabase) {
          throw new Error(
            "Library Supabase tidak berhasil dimuat. Periksa koneksi internet."
          );
        }

        const { data, error } = await db.auth.getSession();

        if (error) throw error;

        currentUser = data.session ? data.session.user : null;

        if (!currentUser) {
          $("shopName").textContent = "Belum login";
          $("dashboard").classList.add("hidden");
          $("loginPrompt").classList.remove("hidden");
          showNotice("Login diperlukan untuk melihat pesanan.", "warning");
          return;
        }

        await loadShop(currentUser);
        await loadOrders();
      } catch (error) {
        console.error("Inisialisasi kasir gagal:", error);

        showNotice(
          "Dashboard belum dapat dibuka: " +
          (error.message || "Kesalahan tidak diketahui"),
          "error"
        );

        $("dashboard").classList.add("hidden");
      }
    }

    $("refreshBtn").addEventListener("click", loadOrders);

    $("logoutBtn").addEventListener("click", async function () {
      const confirmed = window.confirm("Keluar dari akun KopiHub?");
      if (!confirmed) return;

      const { error } = await db.auth.signOut();

      if (error) {
        showNotice("Gagal keluar: " + error.message, "error");
        return;
      }

      window.location.href = "login.html";
    });

    $("loginBtn").addEventListener("click", function () {
      window.location.href = "login.html";
    });

    $("searchInput").addEventListener("input", renderOrders);
    $("statusFilter").addEventListener("change", renderOrders);

    $("orders").addEventListener("click", function (event) {
      const statusButton = event.target.closest("[data-status]");
      const paymentButton = event.target.closest("[data-payment]");

      if (statusButton) {
        updateOrderStatus(statusButton.dataset.status);
      } else if (paymentButton) {
        confirmCashPayment(paymentButton.dataset.payment);
      }
    });

    db.auth.onAuthStateChange(function (event, session) {
      if (event === "SIGNED_OUT" || !session) {
        $("dashboard").classList.add("hidden");
        $("loginPrompt").classList.remove("hidden");
        $("shopName").textContent = "Belum login";
      }
    });

    start();

    window.setInterval(function () {
      if (activeShop && currentUser) {
        loadOrders();
      }
    }, 30000);
  </script>
</body>
</html>
