
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasir | KopiHub</title>
<style>
:root {
  --green:#1d3d30;
  --green2:#315c46;
  --cream:#f7f5ed;
  --orange:#e4a05f;
  --muted:#7c847c;
  --line:#e3e6dc;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--cream);color:#26372e;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
header{background:var(--green);color:white;padding:24px 20px 28px}
.top,main{max-width:1000px;margin:auto}
.logo{font-size:27px;font-weight:900}
.logo span{color:#a8d0b4}
header p{margin:8px 0 0;color:#dce6de}
main{padding:24px 16px 50px}
h1{font-size:28px;margin:8px 0}
.sub{color:var(--muted);line-height:1.5}
.warning{
  background:#fff0dc;border-radius:12px;padding:13px 15px;
  font-size:13px;line-height:1.6;margin-top:18px
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.stat,.panel,.order{
  background:white;border:1px solid var(--line);
  border-radius:16px;padding:16px
}
.stat small{display:block;color:var(--muted);margin-bottom:9px}
.stat strong{font-size:23px;color:var(--green)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
select,button{font:inherit;border-radius:11px;padding:12px}
select{border:1px solid var(--line);background:white;flex:1;min-width:145px}
button{border:0;cursor:pointer;font-weight:750}
.refresh{background:var(--green);color:white}
.order{margin:13px 0}
.order-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.order-id{font-weight:900;color:var(--green);font-size:17px}
.time{font-size:12px;color:var(--muted);margin-top:5px}
.tag{font-size:12px;font-weight:800;padding:7px 10px;border-radius:30px;background:#fff0dc;color:#85521f;height:fit-content}
.tag.proses{background:#e5edff;color:#244b92}
.tag.selesai{background:#e5f1e7;color:#24583a}
.tag.batal{background:#fbe9e6;color:#923c32}
.details{border-top:1px solid var(--line);margin-top:14px;padding-top:13px;line-height:1.8;font-size:14px}
.items{margin:8px 0;padding-left:20px}
.total{display:flex;justify-content:space-between;gap:10px;font-weight:900;font-size:18px;margin:12px 0;color:var(--green)}
.note{background:var(--cream);border-radius:10px;padding:10px;font-size:13px;margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions button{flex:1;min-width:125px}
.next{background:var(--green);color:white}
.done{background:#e5f1e7;color:#24583a}
.cancel{background:#fbe9e6;color:#923c32}
.empty{text-align:center;padding:35px 15px;color:var(--muted)}
#lastUpdated{font-size:12px;color:var(--muted);margin-top:10px}
@media(max-width:480px){
  .stats{gap:7px}
  .stat{padding:12px 8px}
  .stat strong{font-size:19px}
  .stat small{font-size:11px}
  h1{font-size:25px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">Kopi<span>Hub</span></div>
    <p>Dashboard Kasir · Ontal Kopi</p>
  </div>
</header>

<main>
  <h1>Pesanan Masuk</h1>
  <p class="sub">Kelola pesanan pelanggan dari konfirmasi sampai selesai.</p>

  <div class="warning">
    <b>Mode demo.</b> Pesanan tersimpan di penyimpanan browser ini.
    Data belum tersinkron otomatis ke perangkat lain.
  </div>

  <section class="stats">
    <div class="stat"><small>Total pesanan</small><strong id="count">0</strong></div>
    <div class="stat"><small>Menunggu</small><strong id="pending">0</strong></div>
    <div class="stat"><small>Selesai</small><strong id="finished">0</strong></div>
  </section>

  <div class="toolbar">
    <select id="filter" aria-label="Filter status">
      <option value="Semua">Semua pesanan</option>
      <option value="Menunggu">Menunggu konfirmasi</option>
      <option value="Diproses">Sedang dibuat</option>
      <option value="Selesai">Selesai</option>
      <option value="Dibatalkan">Dibatalkan</option>
    </select>
    <button class="refresh" id="refreshButton" type="button">↻ Perbarui</button>
  </div>

  <div id="orders" aria-live="polite"></div>
  <div id="lastUpdated"></div>
</main>

<script>
"use strict";

const STORAGE_KEY = "kopihubDemoOrders";

function readOrders(){
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(data) ? data : [];
  } catch (error) {
    return [];
  }
}

function money(value){
  return new Intl.NumberFormat("id-ID", {
    style:"currency", currency:"IDR", maximumFractionDigits:0
  }).format(Number(value) || 0);
}

function safe(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[c]));
}

function getStatus(order){
  const raw = String(order.status || order.orderStatus || "Menunggu")
    .toLowerCase().trim();

  if (["selesai","completed","complete","done"].includes(raw))
    return "Selesai";

  if (["dibatalkan","cancelled","canceled","rejected"].includes(raw))
    return "Dibatalkan";

  if (["diproses","preparing","processing","in_progress"].includes(raw))
    return "Diproses";

  if ([
    "menunggu","pending","awaiting_confirmation",
    "awaiting_cashier","waiting","new"
  ].includes(raw))
    return "Menunggu";

  return order.status ? String(order.status) :
    order.orderStatus ? String(order.orderStatus) : "Menunggu";
}

function getItems(order){
  if (Array.isArray(order.items)) return order.items;
  if (Array.isArray(order.cart)) return order.cart;
  return [];
}

function getTotal(order){
  if (order.total != null) return Number(order.total) || 0;
  if (order.grandTotal != null) return Number(order.grandTotal) || 0;

  return getItems(order).reduce((sum,item) => {
    return sum + (Number(item.price)||0) *
      (Number(item.qty ?? item.quantity)||1);
  },0);
}

function formatDate(value){
  if (!value) return "Waktu tidak tersedia";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  return date.toLocaleString("id-ID", {
    day:"2-digit", month:"short", year:"numeric",
    hour:"2-digit", minute:"2-digit"
  });
}

function render(){
  const all = readOrders();

  document.getElementById("count").textContent = all.length;
  document.getElementById("pending").textContent =
    all.filter(o => getStatus(o) === "Menunggu").length;
  document.getElementById("finished").textContent =
    all.filter(o => getStatus(o) === "Selesai").length;

  const filter = document.getElementById("filter").value;
  const shown = all.map((order,index) => ({...order,_index:index}))
    .filter(order => filter === "Semua" || getStatus(order) === filter)
    .reverse();

  const container = document.getElementById("orders");

  if (!shown.length){
    container.innerHTML = `
      <div class="panel empty">
        <h3>Tidak ada pesanan</h3>
        <p>Pesanan dengan status ini belum tersedia.</p>
      </div>`;
  } else {
    container.innerHTML = shown.map(order => {
      const status = getStatus(order);
      const items = getItems(order);
      const number = order.orderNumber || order.orderId || order.id ||
        ("DEMO-" + String(order._index + 1).padStart(3,"0"));
      const table = order.table || order.tableNumber || order.meja || "-";
      const customer = order.customerName || order.name || "-";
      const phone = order.customerPhone || order.phone || "";
      const note = order.note || order.notes || order.customerNote || "";

      const itemLines = items.length ? items.map(item => {
        const qty = Number(item.qty ?? item.quantity) || 1;
        const name = item.name || item.title || "Menu";
        return `<li>${safe(name)} × ${qty} — ${money((Number(item.price)||0)*qty)}</li>`;
      }).join("") : "<li>Detail menu tidak tersedia.</li>";

      const tagClass = status === "Selesai" ? "selesai" :
        status === "Diproses" ? "proses" :
        status === "Dibatalkan" ? "batal" : "";

      let buttons = "";
      if (status === "Menunggu") {
        buttons += `<button class="next" data-index="${order._index}" data-status="Diproses">Terima Pesanan</button>`;
      }
      if (status === "Diproses") {
        buttons += `<button class="done" data-index="${order._index}" data-status="Selesai">Tandai Selesai</button>`;
      }
      if (status === "Menunggu" || status === "Diproses") {
        buttons += `<button class="cancel" data-index="${order._index}" data-status="Dibatalkan">Batalkan</button>`;
      }

      return `<article class="order">
        <div class="order-head">
          <div>
            <div class="order-id">${safe(number)}</div>
            <div class="time">${safe(formatDate(order.createdAt || order.date || order.timestamp))}</div>
          </div>
          <span class="tag ${tagClass}">${safe(status === "Menunggu" ? "Menunggu konfirmasi" : status === "Diproses" ? "Sedang dibuat" : status)}</span>
        </div>
        <div class="details">
          <div><b>Meja:</b> ${safe(table)}</div>
          <div><b>Pelanggan:</b> ${safe(customer)}</div>
          ${phone ? `<div><b>Telepon:</b> ${safe(phone)}</div>` : ""}
          <ul class="items">${itemLines}</ul>
          ${note ? `<div class="note"><b>Catatan:</b> ${safe(note)}</div>` : ""}
          <div class="total"><span>Total</span><span>${money(getTotal(order))}</span></div>
          <div><b>Pembayaran:</b> ${safe(order.paymentMethod || order.payment || "Bayar di kasir")}</div>
          ${order.paymentStatus ? `<div><b>Status pembayaran:</b> ${safe(order.paymentStatus)}</div>` : ""}
        </div>
        ${buttons ? `<div class="actions">${buttons}</div>` : ""}
      </article>`;
    }).join("");
  }

  document.getElementById("lastUpdated").textContent =
    "Terakhir diperbarui: " + new Date().toLocaleTimeString("id-ID");
}

function setStatus(index,status){
  const orders = readOrders();
  if (!orders[index]) return;

  orders[index].status = status;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
  render();
}

document.getElementById("refreshButton").addEventListener("click", () => {
  render();
  const button = document.getElementById("refreshButton");
  button.textContent = "✓ Diperbarui";
  setTimeout(() => button.textContent = "↻ Perbarui", 1500);
});

document.getElementById("filter").addEventListener("change", render);

document.getElementById("orders").addEventListener("click", event => {
  const button = event.target.closest("button[data-index][data-status]");
  if (!button) return;
  setStatus(Number(button.dataset.index), button.dataset.status);
});

render();
</script>
</body>
</html>
