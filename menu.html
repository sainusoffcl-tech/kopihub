
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123b2c">
  <title>Menu Ontal Kopi - KopiHub</title>
  <link rel="stylesheet" href="style.css">
  
<style>
  :root {
    --green: #123b2c;
    --green-light: #1e5a41;
    --cream: #f7f5ed;
    --orange: #e99a48;
    --text: #26372d;
    --muted: #788279;
    --border: #e8e8dd;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  .navbar {
    padding: 16px 5%;
    background: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .logo {
    color: var(--green);
    font-size: 23px;
    font-weight: 850;
    text-decoration: none;
  }

  .logo span {
    color: var(--orange);
  }

  .owner-link {
    color: var(--green);
    font-size: 13px;
    font-weight: 650;
    text-decoration: none;
  }

  .menu-header {
    padding: 38px 6% 44px;
    color: white;
    background:
      radial-gradient(circle at 90% 15%, #387354 0, transparent 35%),
      linear-gradient(135deg, #123b2c, #1c5139);
    border-radius: 0 0 28px 28px;
  }

  .menu-header .eyebrow {
    color: #f4bd7d;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
  }

  .menu-header h1 {
    margin: 12px 0;
    font-size: clamp(30px, 6vw, 42px);
    letter-spacing: -1px;
  }

  .menu-header p:last-child {
    color: #e0e9e1;
    line-height: 1.6;
  }

  .menu-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 310px;
    gap: 24px;
    padding: 28px 5%;
    align-items: start;
    max-width: 1400px;
    margin: auto;
  }

  .menu-category {
    margin-bottom: 32px;
  }

  .menu-category h2 {
    color: var(--green);
    font-size: 21px;
    margin: 0 0 15px;
  }

  .menu-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .menu-item,
  .cart-box {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 5px 18px rgba(18, 59, 44, 0.045);
  }

  .menu-item {
    padding: 18px;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .menu-item h3 {
    color: var(--text);
    margin: 0 0 8px;
    font-size: 16px;
    line-height: 1.4;
  }

  .menu-item p {
    margin: 0 0 17px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
  }

  .menu-action {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .price {
    color: var(--green);
    font-weight: 850;
    font-size: 14px;
  }

  .add-button,
  .checkout-button {
    border: 0;
    border-radius: 10px;
    background: var(--green);
    color: white;
    padding: 11px 13px;
    font-size: 12px;
    font-weight: 750;
    cursor: pointer;
    transition: background 0.2s;
  }

  .add-button:hover,
  .checkout-button:hover {
    background: var(--green-light);
  }

  .add-button:active,
  .checkout-button:active {
    transform: scale(0.97);
  }

  .cart-box {
    padding: 22px;
    position: sticky;
    top: 14px;
  }

  .cart-box h2 {
    margin: 0 0 18px;
    color: var(--green);
    font-size: 21px;
  }

  .cart-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #efefe8;
    font-size: 12px;
    line-height: 1.5;
  }

  .cart-row span:last-child {
    white-space: nowrap;
    font-weight: 700;
  }

  .cart-total {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin: 20px 0;
    padding-top: 15px;
    border-top: 1px dashed #d8ddd3;
    color: var(--green);
    font-weight: 850;
    font-size: 16px;
  }

  .checkout-button {
    width: 100%;
    padding: 14px;
    background: var(--orange);
    color: #26372d;
    font-size: 14px;
  }

  .checkout-button:hover {
    background: #f1ad63;
  }

  .cart-empty {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }

  .cart-note {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.6;
    margin-bottom: 0;
  }

  @media (max-width: 760px) {
    .navbar {
      padding: 15px 5%;
    }

    .logo {
      font-size: 21px;
    }

    .owner-link {
      font-size: 12px;
    }

    .menu-header {
      padding: 30px 6% 34px;
    }

    .menu-layout {
      grid-template-columns: 1fr;
      padding: 24px 5%;
      gap: 22px;
    }

    .menu-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .menu-item {
      padding: 13px;
      border-radius: 14px;
    }

    .menu-item h3 {
      font-size: 14px;
    }

    .price {
      font-size: 12px;
    }

    .add-button {
      padding: 9px 10px;
      font-size: 11px;
    }

    .menu-action {
      align-items: flex-start;
      flex-direction: column;
    }

    .cart-box {
      position: static;
    }
  }

  @media (max-width: 360px) {
    .menu-list {
      grid-template-columns: 1fr;
    }

    .menu-action {
      flex-direction: row;
      align-items: center;
    }
  }
</style>

</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">Kopi<span>Hub</span></a>
    <a class="owner-link" href="index.html">← Kembali ke beranda</a>
  </header>

  <section class="menu-header">
    <p class="eyebrow">RACIKAN RASA, CERITA KITA.</p>
    <h1>Ontal Kopi ☕</h1>
    <p>Pilih minuman favoritmu dan masukkan ke keranjang.</p>
  </section>

  <main class="menu-layout">
    <div id="menu-container">
      <p>Memuat menu...</p>
    </div>

    <aside class="cart-box">
      <h2>Keranjang 🛒</h2>
      <div id="cart-items">
        <p class="cart-empty">Keranjang kamu masih kosong.</p>
      </div>
      <div class="cart-total">
        <span>Total</span>
        <span id="cart-total">Rp0</span>
      </div>
      <button class="checkout-button" id="checkout">
        Lanjutkan Pesanan
      </button>
      <p class="cart-note">
        Ini masih demo. Pesanan belum dikirim ke kedai atau disimpan ke database.
      </p>
    </aside>
  </main>

  <script>
    const products = [
      { name: "Ontal Kopi", category: "Coffee Signature", price: 25000 },
      { name: "Bula City Oil", category: "Coffee Signature", price: 25000 },
      { name: "Kurma Coffee Latte", category: "Coffee Signature", price: 25000 },
      { name: "Ice Coffee Lemonade", category: "Coffee Signature", price: 20000 },
      { name: "Ice Peach Coffee", category: "Coffee Signature", price: 20000 },
      { name: "Eskocie", category: "Coffee Signature", price: 20000 },
      { name: "Strawberry Americano", category: "Coffee Signature", price: 20000 },

      { name: "Matcha Latte", category: "Non Coffee Favorite", price: 25000 },
      { name: "Red Velvet Latte", category: "Non Coffee Favorite", price: 20000 },
      { name: "Air Panas Niff", category: "Non Coffee Favorite", price: 20000 },
      { name: "Matcha Strawberry", category: "Non Coffee Favorite", price: 25000 },
      { name: "Taro Latte", category: "Non Coffee Favorite", price: 18000 },
      { name: "Chocolate Latte", category: "Non Coffee Favorite", price: 18000 },

      { name: "Coffee Pandan", category: "Coffee Latte Series", price: 25000 },
      { name: "Vanilla Coffee Latte", category: "Coffee Latte Series", price: 20000 },
      { name: "Hazelnut Coffee Latte", category: "Coffee Latte Series", price: 20000 },
      { name: "Caramel Coffee Latte", category: "Coffee Latte Series", price: 23000 },
      { name: "Butterscotch Coffee", category: "Coffee Latte Series", price: 23000 },
      { name: "Red Velvet Coffee Latte", category: "Coffee Latte Series", price: 23000 },
      { name: "Matelas Coffee", category: "Coffee Latte Series", price: 20000 },
      { name: "Matcha Coffee Latte", category: "Coffee Latte Series", price: 25000 },

      { name: "Tubruk", category: "Classic Coffee", price: 20000 },
      { name: "Espresso", category: "Classic Coffee", price: 20000 },
      { name: "Capoccino", category: "Classic Coffee", price: 20000 },
      { name: "Americano", category: "Classic Coffee", price: 20000 },
      { name: "V60 Manual Brew", category: "Classic Coffee", price: 35000 },
      { name: "Japanese Coffee", category: "Classic Coffee", price: 35000 }
    ];

    const cart = {};
    const rupiah = value =>
      new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(value);

    function renderMenu() {
      const container = document.getElementById("menu-container");
      const categories = [...new Set(products.map(p => p.category))];

      container.innerHTML = categories.map(category => {
        const items = products.filter(p => p.category === category);

        return `
          <section class="menu-category">
            <h2>${category}</h2>
            <div class="menu-list">
              ${items.map(p => {
                const index = products.indexOf(p);
                return `
                  <article class="menu-item">
                    <h3>${p.name}</h3>
                    <p>Minuman pilihan Ontal Kopi</p>
                    <div class="menu-action">
                      <span class="price">${rupiah(p.price)}</span>
                      <button class="add-button" data-add="${index}">
                        + Tambah
                      </button>
                    </div>
                  </article>
                `;
              }).join("")}
            </div>
          </section>
        `;
      }).join("");
    }

    function renderCart() {
      const container = document.getElementById("cart-items");
      const entries = Object.entries(cart).filter(([, qty]) => qty > 0);
      let total = 0;

      if (entries.length === 0) {
        container.innerHTML =
          '<p class="cart-empty">Keranjang kamu masih kosong.</p>';
      } else {
        container.innerHTML = entries.map(([index, qty]) => {
          const p = products[Number(index)];
          total += p.price * qty;

          return `
            <div class="cart-row">
              <span>${p.name} × ${qty}</span>
              <span>${rupiah(p.price * qty)}</span>
            </div>
          `;
        }).join("");
      }

      document.getElementById("cart-total").textContent = rupiah(total);
    }

    document.getElementById("menu-container").addEventListener("click", event => {
      const button = event.target.closest("[data-add]");
      if (!button) return;

      const index = button.dataset.add;
      cart[index] = (cart[index] || 0) + 1;
      renderCart();
    });

    
document.getElementById("checkout").addEventListener("click", () => {
  const entries = Object.entries(cart).filter(([, qty]) => qty > 0);

  if (entries.length === 0) {
    alert("Silakan pilih menu terlebih dahulu.");
    return;
  }

  const order = entries.map(([index, qty]) => ({
    name: products[Number(index)].name,
    price: products[Number(index)].price,
    qty: qty
  }));

  try {
    sessionStorage.setItem(
      "kopihubCheckout",
      JSON.stringify(order)
    );

    window.location.href = "checkout.html";
  } catch (error) {
    alert("Keranjang gagal disimpan. Silakan coba lagi.");
  }
});

      const entries = Object.entries(cart).filter(([, qty]) => qty > 0);

      if (entries.length === 0) {
        alert("Silakan pilih menu terlebih dahulu.");
        return;
      }

      alert(
        "Demo keranjang berhasil! Langkah berikutnya kita akan membuat halaman checkout dan menyimpan pesanan dengan Supabase."
      );
    });

    renderMenu();
    renderCart();
  </script>
</body>
</html>
