
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil Kedai | KopiHub</title>
  <style>
    :root {
      --green: #174c38;
      --light: #e8f2ec;
      --bg: #f5f7f5;
      --text: #26352d;
      --muted: #718078;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px 14px 40px;
      background: var(--bg); color: var(--text);
      font-family: Arial, sans-serif;
    }
    header {
      max-width: 620px; margin: 0 auto 22px;
      padding: 20px; background: var(--green);
      color: white; border-radius: 16px;
    }
    header h1 { margin: 0 0 8px; font-size: 24px; }
    header p { margin: 0; color: #dcebe1; font-size: 14px; line-height: 1.5; }
    main {
      max-width: 620px; margin: auto; padding: 22px;
      background: white; border: 1px solid #e2e9e3; border-radius: 16px;
    }
    label { display: block; margin: 17px 0 7px; font-size: 14px; font-weight: bold; }
    input, select, textarea {
      width: 100%; padding: 13px; border: 1px solid #d5ded7;
      border-radius: 9px; background: white; color: var(--text);
      font: inherit; font-size: 16px;
    }
    textarea { min-height: 90px; resize: vertical; }
    .hint { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    button {
      width: 100%; margin-top: 22px; padding: 14px;
      border: 0; border-radius: 10px; background: var(--green);
      color: white; font-size: 15px; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .65; }
    .message {
      display: none; margin-top: 16px; padding: 13px;
      border-radius: 9px; font-size: 14px; line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .message.show { display: block; }
    .message.info { background: var(--light); color: var(--green); }
    .message.error { background: #fff0ef; color: #a32d25; }
    .back { display: block; margin-top: 20px; text-align: center; color: var(--green); font-size: 14px; }
    footer { max-width: 620px; margin: 20px auto 0; color: var(--muted); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>☕ Profil Kedai</h1>
    <p>Isi informasi kedai Anda untuk mempersiapkan halaman menu digital KopiHub.</p>
  </header>

  <main>
    <form id="shopForm">
      <label for="shopName">Nama kedai *</label>
      <input id="shopName" type="text" placeholder="Contoh: Ontal Kopi" maxlength="100" required>

      <label for="businessType">Jenis usaha *</label>
      <select id="businessType" required>
        <option value="">Pilih jenis usaha</option>
        <option value="coffee_shop">Coffee shop</option>
        <option value="cafe">Kafe</option>
        <option value="restaurant">Restoran</option>
        <option value="food_stall">Warung makan</option>
        <option value="other">Lainnya</option>
      </select>

      <label for="address">Alamat kedai *</label>
      <textarea id="address" placeholder="Masukkan alamat lengkap kedai" maxlength="500" required></textarea>

      <label for="phone">Nomor telepon</label>
      <input id="phone" type="tel" placeholder="Contoh: 08xxxxxxxxxx" maxlength="25">

      <label for="slug">Nama tautan menu</label>
      <input id="slug" type="text" placeholder="Akan dibuat dari nama kedai"
        maxlength="80" pattern="[a-z0-9]+(-[a-z0-9]+)*" autocomplete="off" required>
      <p class="hint">Gunakan huruf kecil, angka, dan tanda hubung. Tautan ini menjadi identitas menu kedai.</p>

      <button id="saveButton" type="submit">Simpan Profil Kedai</button>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>

    <a class="back" href="dashboard-owner.html">Kembali ke Dashboard Pemilik</a>
  </main>

  <footer>KopiHub © 2026</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Gunakan konfigurasi yang sama seperti akun.html.
    const SUPABASE_URL = "https://ozcliasebeydgyvgluht.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_X3z6XFroL-eNdwB14y6dYw_81dvj1yN";

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("shopForm");
    const nameInput = document.getElementById("shopName");
    const slugInput = document.getElementById("slug");
    const saveButton = document.getElementById("saveButton");
    const message = document.getElementById("message");

    function showMessage(text, type = "info") {
      message.textContent = text;
      message.className = "message show " + type;
    }

    function makeSlug(value) {
      return value.normalize("NFKD")
        .toLowerCase()
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 80)
        .replace(/-+$/g, "");
    }

    nameInput.addEventListener("input", () => {
      if (!slugInput.dataset.edited) {
        slugInput.value = makeSlug(nameInput.value);
      }
    });

    slugInput.addEventListener("input", () => {
      slugInput.dataset.edited = "true";
      slugInput.value = makeSlug(slugInput.value);
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (SUPABASE_URL.startsWith("GANTI_DENGAN") ||
          SUPABASE_PUBLISHABLE_KEY.startsWith("GANTI_DENGAN")) {
        showMessage("Isi URL dan publishable key Supabase terlebih dahulu.", "error");
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "Menyimpan...";

      try {
        const { data: sessionData, error: sessionError } =
          await client.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session) {
          showMessage("Sesi login tidak ditemukan. Silakan masuk kembali ke KopiHub.", "error");
          return;
        }

        const { data, error } = await client.rpc("kh_create_shop", {
          p_name: nameInput.value.trim(),
          p_slug: slugInput.value.trim(),
          p_business_type: document.getElementById("businessType").value,
          p_address: document.getElementById("address").value.trim(),
          p_phone: document.getElementById("phone").value.trim() || null
        });

        if (error) throw error;

        showMessage("Profil kedai berhasil disimpan! ID kedai: " + data +
          ". Mengarahkan ke dashboard...", "info");

        setTimeout(() => {
          window.location.href = "dashboard-owner.html";
        }, 1800);
      } catch (error) {
        console.error(error);
        showMessage("Profil belum tersimpan. " + (error.message || "Terjadi kesalahan."),
          "error");
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "Simpan Profil Kedai";
      }
    });
  </script>
</body>
</html>
