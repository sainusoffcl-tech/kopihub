
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Kata Sandi - KopiHub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f4;
      color: #173b2b;
      padding: 24px;
      margin: 0;
    }
    main {
      max-width: 420px;
      margin: 50px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000012;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd5ce; }
    button {
      border: 0;
      background: #14532d;
      color: white;
      cursor: pointer;
    }
    #pesan { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>Reset kata sandi</h1>
  <p>Masukkan kata sandi baru untuk akun KopiHub kamu.</p>

  <form id="formReset">
    <label for="sandiBaru">Kata sandi baru</label>
    <input id="sandiBaru" type="password"
      minlength="6" autocomplete="new-password"
      required placeholder="Minimal 6 karakter">

    <label for="sandiUlang">Ulangi kata sandi</label>
    <input id="sandiUlang" type="password"
      minlength="6" autocomplete="new-password"
      required placeholder="Ulangi kata sandi">

    <button id="tombolReset" type="submit">
      Simpan kata sandi baru
    </button>
  </form>

  <p id="pesan" role="status"></p>
  <a href="akun.html">Kembali ke halaman login</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Salin URL dan publishable key yang sama dari akun.html.
  const SUPABASE_URL = "GANTI_DENGAN_PROJECT_URL_ANDA";
  const SUPABASE_PUBLISHABLE_KEY =
    "GANTI_DENGAN_PUBLISHABLE_KEY_ANDA";

  const client = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const formReset = document.getElementById("formReset");
  const pesanReset = document.getElementById("pesan");
  const tombolReset = document.getElementById("tombolReset");

  formReset.addEventListener("submit", async function (event) {
    event.preventDefault();

    const sandiBaru = document.getElementById("sandiBaru").value;
    const sandiUlang = document.getElementById("sandiUlang").value;

    if (sandiBaru.length < 6) {
      pesanReset.textContent =
        "Kata sandi minimal 6 karakter.";
      return;
    }

    if (sandiBaru !== sandiUlang) {
      pesanReset.textContent =
        "Kedua kata sandi tidak sama.";
      return;
    }

    tombolReset.disabled = true;
    pesanReset.textContent = "Memeriksa sesi dan menyimpan...";

    try {
      const { data: sesiData, error: sesiError } =
        await client.auth.getSession();

      if (sesiError) throw sesiError;

      if (!sesiData.session) {
        throw new Error(
          "Sesi pemulihan tidak ditemukan atau sudah kedaluwarsa. Minta tautan reset baru."
        );
      }

      const { error } = await client.auth.updateUser({
        password: sandiBaru
      });

      if (error) throw error;

      pesanReset.textContent =
        "Kata sandi berhasil diubah. Silakan kembali ke halaman login.";
      formReset.reset();
    } catch (error) {
      pesanReset.textContent =
        "Reset gagal: " + error.message;
    } finally {
      tombolReset.disabled = false;
    }
  });
</script>
</body>
</html>
