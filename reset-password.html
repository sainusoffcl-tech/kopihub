
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Kata Sandi - KopiHub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f3f6f3;
      color: #183b2b;
    }
    main {
      max-width: 430px;
      margin: 40px auto;
      padding: 26px 22px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 28px #123b2a12;
    }
    h1 { color: #14532d; font-size: 25px; }
    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }
    input, button {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd5ce; }
    button {
      margin-top: 14px;
      border: 0;
      background: #14532d;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #pesan { overflow-wrap: anywhere; line-height: 1.5; }
    a { color: #14532d; }
  </style>
</head>
<body>
<main>
  <h1>Reset kata sandi</h1>
  <p>Masukkan kata sandi baru untuk akun KopiHub kamu.</p>

  <form id="formReset">
    <label for="sandiBaru">Kata sandi baru</label>
    <input id="sandiBaru" type="password"
      minlength="6" autocomplete="new-password"
      required placeholder="Minimal 6 karakter">

    <label for="sandiUlang">Ulangi kata sandi</label>
    <input id="sandiUlang" type="password"
      minlength="6" autocomplete="new-password"
      required placeholder="Ketik ulang kata sandi">

    <button type="button" id="lihatSandi">
      Tampilkan kata sandi
    </button>

    <button type="submit" id="simpan">
      Simpan kata sandi baru
    </button>
  </form>

  <p id="pesan" role="status" aria-live="polite">
    Memeriksa sesi pemulihan...
  </p>
  <a href="akun.html">Kembali ke halaman login</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Gunakan konfigurasi yang sama seperti di akun.html.
  const SUPABASE_URL = "https://ozcliasebeydgyvgluht.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_X3z6XFroL-eNdwB14y6dYw_81dvj1yN";

  const pesan = document.getElementById("pesan");
  const form = document.getElementById("formReset");
  const sandiBaru = document.getElementById("sandiBaru");
  const sandiUlang = document.getElementById("sandiUlang");
  const simpan = document.getElementById("simpan");

  let client = null;
  let sesiSiap = false;

  if (
    SUPABASE_URL.startsWith("https://") &&
    !SUPABASE_URL.includes("GANTI_") &&
    SUPABASE_PUBLISHABLE_KEY &&
    !SUPABASE_PUBLISHABLE_KEY.includes("GANTI_")
  ) {
    client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );
  }

  document.getElementById("lihatSandi").onclick = function () {
    const tampil = sandiBaru.type === "text";
    sandiBaru.type = tampil ? "password" : "text";
    sandiUlang.type = tampil ? "password" : "text";
    this.textContent = tampil
      ? "Tampilkan kata sandi"
      : "Sembunyikan kata sandi";
  };

  if (!client) {
    pesan.textContent =
      "Konfigurasi Supabase belum diisi dengan benar.";
  } else {
    client.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        sesiSiap = true;
        pesan.textContent =
          "Tautan pemulihan valid. Silakan masukkan kata sandi baru.";
      } else if (!sesiSiap && !session) {
        pesan.textContent =
          "Buka halaman melalui tautan pemulihan terbaru dari email Supabase.";
      }
    });

    client.auth.getSession().then(({ data, error }) => {
      if (error) {
        pesan.textContent = "Gagal memeriksa sesi: " + error.message;
        return;
      }
      if (data.session && !sesiSiap) {
        sesiSiap = true;
        pesan.textContent =
          "Sesi tersedia. Kamu dapat mengatur kata sandi baru.";
      }
    });
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    if (!client) {
      pesan.textContent = "Konfigurasi Supabase belum benar.";
      return;
    }

    if (!sesiSiap) {
      pesan.textContent =
        "Sesi pemulihan belum tersedia. Buka tautan terbaru dari email.";
      return;
    }

    if (sandiBaru.value.length < 6) {
      pesan.textContent = "Kata sandi minimal 6 karakter.";
      return;
    }

    if (sandiBaru.value !== sandiUlang.value) {
      pesan.textContent = "Kedua kata sandi tidak sama.";
      return;
    }

    simpan.disabled = true;
    pesan.textContent = "Sedang menyimpan kata sandi baru...";

    try {
      const { error } = await client.auth.updateUser({
        password: sandiBaru.value
      });

      if (error) throw error;

      form.reset();
      pesan.textContent =
        "Kata sandi berhasil diubah. Silakan login kembali.";
      sesiSiap = false;
      await client.auth.signOut();
    } catch (error) {
      pesan.textContent = "Reset gagal: " + error.message;
    } finally {
      simpan.disabled = false;
    }
  });
</script>
</body>
</html>
